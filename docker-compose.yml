services:
  app:
    image: myapp:v1
    ports:
      - 8080:8080
    depends_on: 
      - db
  db:
    image: postgres:15
    environment: 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgresql:/var/lib/postgresql/data
  nginx:
    image: nginx:alpine
    ports:
      - 80:80
    depends_on:
      - app 
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf

volumes:
  postgresql: